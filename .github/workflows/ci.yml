name: ci
on: [push, pull_request]
jobs:
  test:
    name: test (py${{ matrix.python }}, pydantic ${{ matrix.pydantic }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
        pydantic: ["2"]
        include:
          # legacy support: pydantic 1.10 (resolves FastAPI <= 0.125, the last line that accepts v1)
          - { python: "3.10", pydantic: "1.10.26" }
          - { python: "3.13", pydantic: "1.10.26" }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: pd, POSTGRES_PASSWORD: pd, POSTGRES_DB: pd }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8
        env: { MYSQL_ROOT_PASSWORD: pd, MYSQL_DATABASE: pd }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -ppd" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python ${{ matrix.python }} && uv pip install -e ".[postgres,mysql]" --group dev "pydantic==${{ matrix.pydantic }}.*"
      - run: .venv/bin/ruff check . && .venv/bin/mypy
        if: matrix.pydantic == '2'
      - run: .venv/bin/pytest --cov=promptpivot --cov-fail-under=90
        env:
          PROMPTPIVOT_TEST_POSTGRES_URL: postgresql+psycopg://pd:pd@localhost:5432/pd
          PROMPTPIVOT_TEST_MYSQL_URL: mysql+pymysql://root:pd@localhost:3306/pd
