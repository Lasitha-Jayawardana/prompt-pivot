[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prompt-pivot"
version = "0.1.0"
description = "Store, version, edit and publish LLM prompts at runtime from inside your FastAPI app, using your own PostgreSQL or MySQL database."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Lasitha Jayawardana" }]
keywords = ["llm", "prompts", "prompt-management", "fastapi", "sqlalchemy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = [
  "sqlalchemy>=2.0",
  "pydantic>=2.0",
  "jinja2>=3.1",
  "fastapi>=0.110",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "psycopg[binary]>=3.1"]
mysql = ["aiomysql>=0.2", "pymysql>=1.1"]
alembic = ["alembic>=1.13"]
yaml = ["pyyaml>=6.0"]
otel = ["opentelemetry-api>=1.20"]

[project.scripts]
prompt-pivot = "promptpivot.cli:main"

[project.urls]
Homepage = "https://github.com/Lasitha-Jayawardana/prompt-pivot"
Repository = "https://github.com/Lasitha-Jayawardana/prompt-pivot"
Issues = "https://github.com/Lasitha-Jayawardana/prompt-pivot/issues"
Changelog = "https://github.com/Lasitha-Jayawardana/prompt-pivot/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/promptpivot"]

[tool.hatch.build.targets.sdist]
include = ["src/promptpivot", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "greenlet>=3",
  "mypy>=1.10",
  "pyyaml>=6.0",
  "alembic>=1.13",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:promptpivot"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src/promptpivot"]
[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "alembic", "alembic.*", "opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "B017", "B011"]
"src/promptpivot/fastapi.py" = ["B008"]
"examples/*" = ["B008"]
"src/promptpivot/migrations/*" = ["E402"]

[tool.hatch.build.targets.wheel.force-include]
"src/promptpivot/migrations/script.py.mako" = "promptpivot/migrations/script.py.mako"
